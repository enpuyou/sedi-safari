name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to check existing tags

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' "sed.i/sed.i Extension/Resources/manifest.json")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Select Xcode
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (unsigned, for local install)
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          xcodebuild \
            -project sed.i/sed.i.xcodeproj \
            -scheme "sed.i" \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          APP_PATH=$(find DerivedData -name "sed.i.app" -maxdepth 6 | head -1)
          zip -r "sed.i.app.zip" "$APP_PATH"

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: sed.i.app.zip
          body: |
            ## Install

            1. Download `sed.i.app.zip` and unzip
            2. Move `sed.i.app` to `/Applications`
            3. Open it once to register the extension with Safari
            4. Enable in **Safari → Settings → Extensions**

            If Gatekeeper blocks it:
            ```
            xattr -rd com.apple.quarantine /Applications/sed.i.app
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
